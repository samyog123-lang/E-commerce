<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Shop | ShopMate</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">


    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">


    <link rel="stylesheet" href="{{ url_for('static', filename='css/shop.css') }}">
</head>
<body>


{% include 'navbar.html' %}

<div class="container my-5">
    <a href="{{ url_for('views.home') }}" class="btn btn-secondary mb-4">← Back to Home</a>
    <h2 class="text-center mb-5">All Products</h2>

    <div class="row g-4">
        {% for product in products %}
        <div class="col-lg-3 col-md-4 col-sm-6">
            <div class="card h-100 shadow-sm">
                <img src="{{ product.image }}" class="card-img-top" alt="{{ product.name }}" style="height:200px; object-fit:cover;">
                <div class="card-body d-flex flex-column">
                    <h5 class="card-title">{{ product.name }}</h5>
                    <p class="card-text fw-bold">{{ product.price }}</p>
                    <a href="{{ url_for('views.checkout', product_id=product.id) }}" class="btn btn-success mt-auto">Buy Now</a>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>

<footer class="text-center py-4 bg-dark text-white">
    © 2026 ShopMate • Built with Flask
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
