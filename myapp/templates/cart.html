<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cart | ShopMate</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
    body {

        background: linear-gradient(135deg, orange, red);
        color: white;
        font-family: 'Poppins', sans-serif;
    }

    footer {
        background: rgba(0, 0, 0, 0.6); 
    }

    .btn-secondary {
        background-color: rgba(255, 255, 255, 0.8);
        color: black;
        border: none;
    }

    .btn-secondary:hover {
        background-color: white;
        color: black;
    }
</style>
</head>
<body>

{% include 'navbar.html' %}

<div class="container my-5">
    <a href="{{ url_for('views.shop') }}" class="btn btn-secondary mb-4">← Back to Shop</a>
    <h2 class="text-center mb-5">Your Cart</h2>

    <div id="cartGrid" class="row g-4">

    </div>

    <p id="emptyCartMsg" class="text-center" style="display:none;">Your cart is empty!</p>
</div>

<footer class="text-center py-4 text-white">
    © 2026 ShopMate • Built with Flask
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>

    const cartItems = {{ cart_items|tojson }};
</script>

<script src="{{ url_for('static', filename='js/cart.js') }}"></script>
</body>
</html>
