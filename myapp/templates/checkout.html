<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout | ShopMate</title>


<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">


<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
body {
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, orange, red);
    color: black;
    margin: 0;
}

.checkout-container {
    max-width: 900px;
    margin: 50px auto;
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(16px);
    border-radius: 20px;
    padding: 30px;
    box-shadow: 0 15px 45px rgba(0,0,0,0.35);
}


.checkout-header {
    text-align: center;
    margin-bottom: 25px;
}
.checkout-header h1 {
    font-weight: 700;
}


.checkout-body {
    display: flex;
    gap: 30px;
    flex-wrap: wrap;
}


.product-summary {
    flex: 1 1 35%;
    display: flex;
    flex-direction: column;
    align-items: center;
    background: rgba(255,255,255,0.05);
    padding: 20px;
    border-radius: 15px;
}

.product-summary img {
    width: 100%;
    max-width: 200px;
    border-radius: 12px;
    object-fit: cover;
    margin-bottom: 15px;
}


.checkout-form {
    flex: 1 1 60%;
    display: flex;
    flex-direction: column;
    gap: 15px;
}

.input-group {
    display: flex;
    flex-direction: column;
}

label {
    font-weight: 500;
    margin-bottom: 5px;
    font-size: 14px;
    opacity: 0.9;
}

input, textarea, select {
    padding: 10px 12px;
    border-radius: 10px;
    border: none;
    background: rgba(255,255,255,0.1);
    color: #fff;
    outline: none;
    font-size: 14px;
    transition: 0.3s;
}

input:focus, textarea:focus, select:focus {
    background: rgba(255,255,255,0.15);
    box-shadow: 0 0 8px rgba(255,255,255,0.2);
}

textarea {
    resize: none;
}

.btn-primary {
    border-radius: 12px;
    padding: 12px;
    font-weight: 600;
    font-size: 16px;
    background: linear-gradient(to right, #0072ff, #00c6ff);
    border: none;
    transition: 0.3s ease;
}

.btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(0,198,255,0.4);
}

@media (max-width: 768px) {
    .checkout-body {
        flex-direction: column;
    }
    .product-summary, .checkout-form {
        flex: 1 1 100%;
    }
}
</style>
</head>

<body>
<div class="checkout-container">
    <a href="{{ url_for('views.shop') }}" class="btn btn-secondary mb-3">← Back to Shop</a>

    <div class="checkout-header">
        <h1>Checkout</h1>
        <p>Fill in your details to place the order</p>
    </div>

    <div class="checkout-body">
        <!-- Product Image -->
        <div class="product-summary">
            <img src="{{ product.image }}" alt="{{ product.name }}">
            <h5>{{ product.name }}</h5>
            <p>{{ product.price }}</p>
        </div>

        <!-- Form -->
        <form method="POST" class="checkout-form">
            <div class="input-group">
                <label for="name">Full Name</label>
                <input type="text" name="name" id="name" placeholder="John Doe" required>
            </div>

            <div class="input-group">
                <label for="email">Email Address</label>
                <input type="email" name="email" id="email" placeholder="you@example.com" required>
            </div>

            <div class="input-group">
                <label for="address">Shipping Address</label>
                <textarea name="address" id="address" rows="3" placeholder="123 Main Street, City, Country" required></textarea>
            </div>

            <div class="input-group">
                <label for="payment">Payment Method</label>
                <select name="payment" id="payment" required>
                    <option value="" disabled selected>Select a method</option>
                    <option value="cod">Cash on Delivery</option>
                    <option value="khalti">khalti</option>
                    <option value="offline">offline</option>
                </select>
            </div>

            <button type="submit" class="btn btn-primary mt-2">Place Order</button>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
